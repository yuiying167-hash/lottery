name: Lottery Update Bot

on:
  # 1. 스케줄 설정 (UTC 기준)
  schedule:
    # (A) 평소: 매일 오전 9시 UTC (태국 시간 오후 4시) - 하루 1회 정기 업데이트
    - cron: '0 9 * * *'
    
    # (B) 추첨일(1일, 16일): 오전 8시~10시 UTC (태국 시간 오후 3시~5시)
    #     -> 15분마다 실행해서 결과를 빠르게 반영!
    - cron: '*/15 8-10 1,16 * *'

  # 2. 수동 실행 버튼 (테스트용)
  workflow_dispatch:

permissions:
  contents: write # 저장소에 글을 쓸 수 있는 권한

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 파이썬 설치
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      # 3. 필요한 라이브러리 설치
      - name: Install libraries
        run: pip install requests pytz

      # 4. 파이썬 로봇 실행 (main.py)
      - name: Run crawler script
        run: python main.py

      # 5. 결과물(index.html) 저장하고 깃허브에 올리기
      - name: Commit and Push
        run: |
          git config --global user.name 'LottoBot'
          git config --global user.email 'bot@noreply.github.com'
          git add index.html
          # 변경 사항이 있을 때만 커밋 (에러 방지)
          git commit -m "Update lottery data: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
